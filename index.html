<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Smash Fest · VIP</title>
<style>
  :root { --fondo:#f6f4ef; --texto:#1d1b18; --suave:#6b665e; --borde:#d8d3c8; --acento:#c2410c; --error:#b91c1c; --campo:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fondo:#171614; --texto:#f1eee8; --suave:#a8a297; --borde:#3a3732; --acento:#fb923c; --error:#f87171; --campo:#24221f; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--fondo); color:var(--texto); font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width:100%; max-width:360px; }
  h1 { font-size:1.35rem; margin:0 0 6px; }
  p { margin:0 0 18px; color:var(--suave); }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=password] { width:100%; font-size:1.1rem; padding:12px; border:1px solid var(--borde); border-radius:10px; background:var(--campo); color:var(--texto); }
  .recordar { display:flex; gap:8px; align-items:center; font-weight:400; margin:14px 0 18px; color:var(--suave); }
  .recordar input { width:20px; height:20px; }
  button { width:100%; font-size:1.05rem; font-weight:600; padding:13px; border:0; border-radius:10px; background:var(--acento); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  #error { color:var(--error); min-height:1.4em; margin:12px 0 0; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Smash Fest · clientes VIP</h1>

  <input id="clave" type="password" autocomplete="current-password" required>
  <label class="recordar"><input id="recordar" type="checkbox" checked> Recordarla en este celular</label>
  <button id="abrir">Abrir la lista</button>
  <p id="error" role="alert"></p>
</form>

const GUARDADA = "smash-vip-clave";
const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function abrir(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SAL), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, k, bytes(DATOS));
  return new TextDecoder().decode(plano);
}
function mostrar(html) { document.open(); document.write(html); document.close(); }
function leerGuardada() { try { return localStorage.getItem(GUARDADA); } catch (e) { return null; } }
function guardar(v) { try { v ? localStorage.setItem(GUARDADA, v) : localStorage.removeItem(GUARDADA); } catch (e) { console.warn(e); } }
const f = document.getElementById("f"), err = document.getElementById("error"), btn = document.getElementById("abrir");
f.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const clave = document.getElementById("clave").value.trim();
  btn.disabled = true; btn.textContent = "Abriendo…"; err.textContent = "";
  try {
    const html = await abrir(clave);
    guardar(document.getElementById("recordar").checked ? clave : null);
    mostrar(html);
  } catch (e) {
    err.textContent = "Esa clave no es. Revísala y vuelve a intentar.";
    btn.disabled = false; btn.textContent = "Abrir la lista";
  }
});
const previa = leerGuardada();
if (previa) abrir(previa).then(mostrar).catch(() => guardar(null));
